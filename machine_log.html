<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Inspection Log | BARE by Marlese</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Montserrat",sans-serif;
  background:#cacdc6;
  color:#24221a;
  display:flex;
  justify-content:center;
}

.card{
  background:#d4d7d1;
  width:95%;
  max-width:1000px;
  margin:20px;
  padding:30px;
  border-radius:20px;
}

h1{
  text-align:center;
  letter-spacing:.15em;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#5e6959;
  color:#fff;
  padding:12px;
  font-size:13px;
  letter-spacing:.08em;
}

td{
  border:1px solid #999;
  padding:8px;
  height:55px;
}

input{
  width:100%;
  border:none;
  background:transparent;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

input[type="date"]{
  font-size:13px;
}

.signature{
  border-bottom:1px solid #24221a;
  height:30px;
}

.print-btn{
  margin-top:20px;
  text-align:center;
}

button{
  padding:14px 22px;
  background:#5e6959;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

@media print{
  button{display:none;}
}
</style>
</head>

<body>

<div class="card">
  <h1>MACHINE INSPECTION LOG</h1>

  <table id="logTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Check Performed</th>
        <th>Status</th>
        <th>Notes</th>
        <th>Signature</th>
      </tr>
    </thead>

    <tbody>
    </tbody>
  </table>

  <div class="print-btn">
    <button onclick="window.print()">Download PDF</button>
  </div>
</div>

<script>
const tbody = document.querySelector("#logTable tbody");

// Create rows
for(let i = 0; i < 10; i++){
  const row = document.createElement("tr");

  row.innerHTML = `
    <td><input type="date"></td>
    <td><input class="time-field" placeholder="Auto"></td>
    <td><input placeholder="e.g. Handpiece check"></td>
    <td><input placeholder="OK / Issue"></td>
    <td><input placeholder="Notes"></td>
    <td><div class="signature"></div></td>
  `;

  tbody.appendChild(row);
}

// Auto timestamp when typing
document.addEventListener("input", function(e){
  if(e.target.closest("tr")){
    const row = e.target.closest("tr");
    const timeField = row.querySelector(".time-field");

    if(timeField && !timeField.value){
      const now = new Date();
      timeField.value = now.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }
  }
});
</script>

</body>
</html>
