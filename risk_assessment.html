<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Risk Assessment | BARE by Marlese</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#cacdc6;
  --card:#d4d7d1;
  --brand:#5e6959;
  --text:#24221a;
  --muted:#878274;
  --line:rgba(36,34,26,0.10);
  --line-soft:rgba(36,34,26,0.06);
}

*{
  box-sizing:border-box;
  -webkit-print-color-adjust:exact !important;
  print-color-adjust:exact !important;
  color-adjust:exact !important;
}

html, body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden !important;
  background:var(--bg);
}

body{
  font-family:"Montserrat",sans-serif;
  color:var(--text);
  display:block;
  min-height:100vh;
}

input,
textarea,
select{
  font:inherit;
}

.page-shell{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  padding:0;
}

.card{
  width:100%;
  max-width:980px;
  margin:0 auto;
  padding:28px 30px;
  background:rgba(212,215,209,0.94);
  border-radius:0;
}

.logo{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:12px;
  letter-spacing:.26em;
  font-weight:600;
  text-transform:uppercase;
  margin-bottom:5px;
}
.logo .bare{color:var(--brand);font-size:24px;}
.logo .by{
  color:var(--muted);
  font-size:15px;
  font-weight:500;
  text-transform:none;
  letter-spacing:.05em;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:16px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.intro{
  text-align:center;
  font-size:12px;
  line-height:1.6;
  max-width:700px;
  margin:0 auto 16px;
}

.section{
  padding:16px 16px;
  border-radius:14px;
  background:linear-gradient(145deg, rgba(255,255,255,0.30), rgba(255,255,255,0.12));
  border:1px solid rgba(255,255,255,0.42);
  margin-bottom:12px;
}

.section-title{
  margin:0 0 10px;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--brand);
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 14px;
}

.field label{
  display:block;
  margin:0 0 5px;
  font-size:9px;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:700;
  color:var(--brand);
}

.input,
.textarea{
  width:100%;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.82);
  border-radius:10px;
  color:var(--text);
  outline:none;
}

.input{
  height:40px;
  padding:0 12px;
  font-size:13px;
}

textarea.textarea{
  min-height:70px;
  padding:10px 12px;
  font-size:12px;
  line-height:1.45;
  resize:none;
}

.textarea.small{ min-height:56px; }
.wide{ grid-column:1 / -1; }

.table-wrap{
  width:100%;
  border-radius:12px;
  background:rgba(255,255,255,0.18);
  border:1px solid rgba(36,34,26,0.08);
  padding:1px;
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  table-layout:fixed;
}

th, td{
  vertical-align:top;
  padding:0;
  border-right:1px solid var(--line-soft);
  border-bottom:1px solid var(--line-soft);
}

th{
  background:rgba(255,255,255,0.46);
  color:var(--brand);
  font-size:8px;
  font-weight:700;
  text-transform:uppercase;
  padding:8px 5px;
  text-align:left;
}

td textarea, td input{
  border:0;
  background:transparent;
  width:100%;
  outline:none;
}

td textarea{
  min-height:72px;
  padding:7px 6px;
  font-size:9px;
  line-height:1.26;
  resize:none;
  overflow:hidden;
}

th:nth-child(1){width:13%;}
th:nth-child(2){width:12%;}
th:nth-child(3){width:25%;}
th:nth-child(4){width:18%;}
th:nth-child(5){width:8%;}
th:nth-child(6){width:8%;}
th:nth-child(7){width:16%;}

/* PRINT OPTIMIZATION: REMOVE SPACES AND FIT BOXES */
@media print{
  @page{
    size:A4 portrait;
    margin:5mm;
  }

  body, .page-shell{ background:#cacdc6 !important; }

  .card{
    padding:10px !important;
    background:#d4d7d1 !important;
  }

  .section{
    padding:6px !important;
    margin-bottom:6px !important;
    background:#d0d3cd !important;
    border:1px solid rgba(0,0,0,0.05) !important;
  }

  /* Force table cells to wrap text tightly */
  th{
    font-size:6.5px !important;
    padding:3px 2px !important;
  }

  td textarea{
    font-size:7.2px !important;
    line-height:1.1 !important;
    padding:2px 3px !important; /* Minimized padding */
    min-height:0 !important;   /* Let JS height take over */
    margin:0 !important;
  }

  td input{
    font-size:7.2px !important;
    height:18px !important;
    padding:0 2px !important;
  }

  .actions { display:none !important; }
}

.btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:var(--brand);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  border:none;
  margin-top:20px;
}

</style>
</head>
<body>
<div class="page-shell">
<div class="card">

  <div class="logo">
    <span class="bare">BARE |</span>
    <span class="by">by Marlese</span>
  </div>

  <h1>Risk Assessment</h1>

  <div class="section">
    <h2 class="section-title">Assessment Details</h2>
    <div class="grid">
      <div class="field"><label>Business</label><input class="input" type="text" value="BARE by Marlese"></div>
      <div class="field"><label>Assessor</label><input class="input" type="text" value="Marlese Rosch Haden"></div>
      <div class="field"><label>Date</label><input class="input" type="date" id="assessmentDate"></div>
      <div class="field"><label>Review</label><input class="input" type="date"></div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Risk Assessment Register</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Hazard</th>
            <th>Target</th>
            <th>Existing Controls</th>
            <th>Further Action</th>
            <th>Risk</th>
            <th>Owner</th>
            <th>Review</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><textarea class="auto-grow-cell">Laser beam / exposure to eyes</textarea></td>
            <td><textarea class="auto-grow-cell">Practitioner, client, visitor</textarea></td>
            <td><textarea class="auto-grow-cell">Controlled treatment area used; wavelength-specific protective eyewear worn; access restricted; machine used per instructions.</textarea></td>
            <td><textarea class="auto-grow-cell">Record eyewear checks before each session; keep replacements available.</textarea></td>
            <td><input type="text" value="Low"></td>
            <td><input type="text" value="Marlese"></td>
            <td><input type="text" value="Annual"></td>
          </tr>
          <tr>
            <td><textarea class="auto-grow-cell">Skin burn / adverse reaction</textarea></td>
            <td><textarea class="auto-grow-cell">Client</textarea></td>
            <td><textarea class="auto-grow-cell">Consultation; contraindications screened; patch test completed; settings selected per skin type; aftercare explained.</textarea></td>
            <td><textarea class="auto-grow-cell">Review consent forms regularly; update protocols after incidents.</textarea></td>
            <td><input type="text" value="Medium"></td>
            <td><input type="text" value="Marlese"></td>
            <td><input type="text" value="Annual"></td>
          </tr>
          <tr>
            <td><textarea class="auto-grow-cell">Cross-contamination / infection</textarea></td>
            <td><textarea class="auto-grow-cell">Client, practitioner</textarea></td>
            <td><textarea class="auto-grow-cell">Clean treatment area; hand hygiene; gloves; single-use consumables; surfaces disinfected between clients.</textarea></td>
            <td><textarea class="auto-grow-cell">Maintain cleaning schedule and stock check.</textarea></td>
            <td><input type="text" value="Low"></td>
            <td><input type="text" value="Marlese"></td>
            <td><input type="text" value="Annual"></td>
          </tr>
          <tr>
            <td><textarea class="auto-grow-cell">Electrical fault / fire</textarea></td>
            <td><textarea class="auto-grow-cell">Practitioner, client</textarea></td>
            <td><textarea class="auto-grow-cell">Equipment visually checked before use; damaged cables removed; service records retained.</textarea></td>
            <td><textarea class="auto-grow-cell">Log user checks and servicing; replace damaged leads immediately.</textarea></td>
            <td><input type="text" value="Low"></td>
            <td><input type="text" value="Marlese"></td>
            <td><input type="text" value="Annual"></td>
          </tr>
          <tr>
            <td><textarea class="auto-grow-cell">Trips and Slips</textarea></td>
            <td><textarea class="auto-grow-cell">Client, practitioner</textarea></td>
            <td><textarea class="auto-grow-cell">Floor area kept free from clutter; spills cleaned promptly; adequate lighting maintained.</textarea></td>
            <td><textarea class="auto-grow-cell">Check cable routing each clinic day.</textarea></td>
            <td><input type="text" value="Low"></td>
            <td><input type="text" value="Marlese"></td>
            <td><input type="text" value="Annual"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="downloadPDF()">Download PDF</button>
  </div>

</div>
</div>

<script>
function downloadPDF(){
  window.print();
}

function autoGrowTextarea(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight) + 'px';
}

function autoGrowAll(){
  document.querySelectorAll('.auto-grow-cell').forEach(autoGrowTextarea);
}

window.addEventListener('load', autoGrowAll);
window.addEventListener('resize', autoGrowAll);
document.querySelectorAll('.auto-grow-cell').forEach(el => {
  el.addEventListener('input', () => autoGrowTextarea(el));
});

document.getElementById('assessmentDate').valueAsDate = new Date();
</script>

</body>
</html>
