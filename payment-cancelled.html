<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Not Completed | BARE by Marlese</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#cacdc6;color:#24221a}
    main{width:100%;max-width:560px;padding:30px;border-radius:22px;background:#f8f8f6;text-align:center;box-shadow:0 18px 60px rgba(36,34,26,.12)}
    a{display:inline-block;margin-top:14px;padding:12px 16px;border-radius:10px;background:#5e6959;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Payment Not Completed</h1>
    <div id="cancel-message">
      <p>No payment was taken.</p>
      <p>Please return to BARE by Marlese when you are ready to try again.</p>
    </div>
    <a id="return-link" href="/">Return to BARE by Marlese</a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const isReturningClient =
      (params.get("client") || "").toLowerCase() === "existing" ||
      (params.get("returning") || "").toLowerCase() === "true";

    const message = document.getElementById("cancel-message");
    const returnLink = document.getElementById("return-link");

    if (isReturningClient) {
      message.innerHTML = `
        <p>No payment was taken, so your treatment appointment has not been confirmed.</p>
        <p>No appointment was reserved because the payment was not completed.</p>
        <p>You can return to the returning-client treatment page and choose another appointment when you are ready.</p>
      `;

      returnLink.href = "/treatment.html?client=existing";
      returnLink.textContent = "Return to Returning Client Treatments";
    } else {
      message.innerHTML = `
        <p>No balance payment was taken, and your existing appointment has not been changed.</p>
        <p>Please return to your practitioner when you are ready to try again.</p>
      `;

      returnLink.href = "/";
      returnLink.textContent = "Return to BARE by Marlese";
    }
  </script>
</body>
</html>
