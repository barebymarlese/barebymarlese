<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title id="page-title">Treatment Booking | BARE by Marlese</title>
<link id="favicon-link" rel="icon" type="image/png" href="/faviconv4.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#cacdc6;--ink:#24221a;--olive:#5e6959;--olive-dark:#4f5a4b;--stone:#878274;--card:#f8f8f6;--line:rgba(36,34,26,.12)}
*{box-sizing:border-box}html,body{margin:0;padding:0}

body{font-family:'Montserrat',Arial,sans-serif;background:radial-gradient(circle at top,rgba(255,255,255,.45),transparent 30%),linear-gradient(180deg,#d8dbd4 0%,var(--bg) 100%);color:var(--ink);min-height:100vh}

.page{min-height:100vh;padding:28px 16px}
.shell{width:100%;max-width:1100px;margin:0 auto}

.brand{
  text-align:center;
  margin:0 0 18px;
}

#brand-main{
  color:#5e6959;
  font-size:24px;
  font-weight:600;
  letter-spacing:.26em;
  text-transform:uppercase;
}

.brand-divider{
  color:#5e6959;
  opacity:.8;
  margin:0 12px;
  font-size:22px;
}

#brand-sub{
  color:#878274;
  font-size:15px;
  font-weight:500;
  letter-spacing:.05em;
  text-transform:none;
}

.card{background:rgba(248,248,246,.9);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 60px rgba(36,34,26,.10);overflow:hidden;backdrop-filter:blur(6px)}

.hero{padding:40px 28px 24px;text-align:center;background:linear-gradient(180deg,rgba(94,105,89,.08),rgba(94,105,89,0) 100%);border-bottom:1px solid var(--line)}

.kicker{display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(94,105,89,.10);color:var(--olive);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

h1{margin:18px 0 10px;font-size:clamp(28px,4vw,42px);line-height:1.1;font-weight:600}

.sub{max-width:680px;margin:0 auto;font-size:15px;line-height:1.7;color:rgba(36,34,26,.78)}

.content{padding:26px}

.bundle-note{text-align:center;margin:0 auto 22px;max-width:620px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive-dark);font-weight:700;line-height:1.7}

.packages{background:white;border:1px solid var(--line);border-radius:22px;padding:18px 20px}

/* NEW CARD LAYOUT */
.package{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:22px;
  align-items:center;
  padding:22px 0;
  border-bottom:1px solid rgba(36,34,26,.10);
}

.package:last-child{border-bottom:0}

.package h2{
  margin:0;
  font-size:19px;
  font-weight:500;
  letter-spacing:.08em;
}

.price{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.btn{
  appearance:none;
  border:1px solid rgba(94,105,89,.18);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  min-height:64px;
  padding:12px 14px;
  border-radius:16px;
  text-decoration:none;
  font-family:inherit;
  font-weight:700;
  font-size:12px;
  line-height:1.25;
  background:linear-gradient(180deg,var(--olive),var(--olive-dark));
  color:#fff;
  text-align:left;
}

.btn strong{font-size:15px;margin-top:4px}

.btn:hover{transform:translateY(-1px);opacity:.95}

.notice{margin-top:22px;padding:14px 16px;background:rgba(135,130,116,.10);border:1px solid rgba(135,130,116,.18);border-radius:14px;font-size:13px;line-height:1.65;color:rgba(36,34,26,.76)}

footer{text-align:center;padding:18px 10px 0;color:rgba(36,34,26,.6);font-size:12px}

@media(max-width:900px){
  .package{grid-template-columns:1fr;gap:14px}
  .price{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="page">
<div class="shell">
<div class="brand">
  <span id="brand-main"></span>
  <span class="brand-divider">|</span>
  <span class="brand-sub" id="brand-sub"></span>
</div>

<div class="card">
<div class="hero">
<span class="kicker" id="page-kicker"></span>
<h1>Choose Your Treatment Payment</h1>
<p class="sub">Select your option, complete checkout, then book your appointment.</p>
</div>

<div class="content">
<p class="bundle-note">Bundles and single sessions</p>
<div class="packages" id="packages"></div>

<div class="notice">
<strong>Important:</strong> Only continue with the package agreed during your consultation.
</div>
</div>
</div>

<footer>© <span id="footer-brand"></span></footer>
</div>
</div>

<script src="/config.js"></script>
<script src="/branding.js"></script>
<script>
const CONFIG = window.SITE_CONFIG || {};
const pageTitle = document.getElementById("page-title");

if (pageTitle) {
  pageTitle.textContent = `${CONFIG.pages?.treatmentTitle || "Treatment Packages"} | ${CONFIG.businessName || "BARE by Marlese"}`;
}
const kicker = document.getElementById("page-kicker");
if (kicker) {
  kicker.textContent = CONFIG.pages?.treatmentTitle || "Treatment Packages";
}

const stripeLinks = CONFIG.stripeLinks || {};
const packages = Array.isArray(CONFIG.packages) ? CONFIG.packages : [];

function goToPayment(packageKey, type){
  const link = stripeLinks?.[type]?.[packageKey];

  if (!link) {
    alert("Payment link is not set up for this option.");
    return;
  }

  window.location.href = link;
}

const packagesContainer = document.getElementById("packages");

if (!packages.length) {
  packagesContainer.innerHTML = `
    <p style="text-align:center;padding:20px;">
      No packages configured.
    </p>
  `;
} else {
  packagesContainer.innerHTML = packages.map(pkg => `
    <div class="package">
      <h2>${pkg.name}</h2>
      <div class="price">
        <button class="btn" onclick="goToPayment('${pkg.key}','bundle_deducted')">
          <span>Consultation completed</span>
          <strong>${pkg.bundlePrice}</strong>
        </button>
        <button class="btn" onclick="goToPayment('${pkg.key}','bundle_full')">
          <span>No consultation</span>
          <strong>${pkg.fullPrice}</strong>
        </button>
        <button class="btn" onclick="goToPayment('${pkg.key}','single')">
          <span>Single session</span>
          <strong>${pkg.singlePrice}</strong>
        </button>
      </div>
    </div>
  `).join("");
}
</script>

</body>
</html>
