<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Treatments & Pricing | BARE by Marlese</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#cacdc6;--ink:#24221a;--olive:#5e6959;--olive-dark:#4f5a4b;--stone:#878274;--card:#f8f8f6;--line:rgba(36,34,26,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:linear-gradient(180deg,#d8dbd4,var(--bg));color:var(--ink)}
.page{padding:28px 16px;min-height:100vh}.shell{max-width:1100px;margin:auto}.brand{text-align:center;margin-bottom:18px}.brand-main{color:var(--olive);font-size:24px;font-weight:600;letter-spacing:.26em}.brand-sub{color:var(--stone)}
.card{background:rgba(248,248,246,.94);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 18px 60px rgba(36,34,26,.1)}
.hero{text-align:center;padding:38px 24px 24px;border-bottom:1px solid var(--line)}h1{margin:10px 0;font-size:clamp(28px,4vw,42px)}.sub{line-height:1.7;color:rgba(36,34,26,.75)}
.content{padding:24px}.notice{padding:15px 17px;border-radius:14px;background:#eceee9;border:1px solid var(--line);font-size:13px;line-height:1.65;margin-bottom:22px}
.section{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:20px}.section h2{text-align:center;margin:0 0 8px}.section-intro{text-align:center;font-size:13px;line-height:1.6;color:rgba(36,34,26,.7);margin:0 0 18px}
.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:15px;border-radius:15px;background:#f8f8f6;border:1px solid rgba(36,34,26,.09)}
.row h3{margin:0 0 4px;font-size:15px}.row p{margin:0;font-size:12px;color:rgba(36,34,26,.65)}button.pay{border:0;border-radius:13px;padding:12px 15px;background:var(--olive);color:#fff;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
button.pay:disabled{opacity:.55;cursor:wait}.actions{text-align:center;margin-top:18px}.link{display:inline-flex;padding:13px 18px;border-radius:13px;background:var(--olive);color:white;text-decoration:none;font-weight:700;font-size:13px}
.status{text-align:center;margin:14px 0;font-size:13px}.error{color:#8a3b3b}.mode{display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(94,105,89,.1);color:var(--olive);font-size:12px;font-weight:700}
@media(max-width:650px){.content{padding:15px}.row{grid-template-columns:1fr}.pay{width:100%}}
</style>
</head>
<body><div class="page"><div class="shell">
<div class="brand"><span class="brand-main">BARE</span> | <span class="brand-sub">by Marlese</span></div>
<div class="card"><div class="hero"><span class="mode" id="mode-label"></span><h1>Treatments & Pricing</h1><p class="sub" id="hero-copy"></p></div>
<div class="content"><div class="notice" id="notice"></div><div id="sections"></div><div class="status" id="status"></div><div class="actions"><a class="link" href="/consultation.html">Return to Book Now</a></div></div></div>
</div></div>
<script src="/config.js"></script><script src="/analytics.js"></script>
<script>
const CONFIG=window.SITE_CONFIG||{};
const params=new URLSearchParams(location.search);
const existing=params.get("client")==="existing"||sessionStorage.getItem("bareClientType")==="existing";
const mode=document.getElementById("mode-label"),hero=document.getElementById("hero-copy"),notice=document.getElementById("notice"),sections=document.getElementById("sections"),status=document.getElementById("status");
mode.textContent=existing?"Existing Client":"Consultation Completed";
hero.textContent=existing?"Choose a full-price treatment or package. You will book your appointment after secure checkout.":"Choose the approved tattoo option after your consultation and patch test. Carbon and fungal balances are provided through your appointment-specific clinic QR.";
notice.innerHTML=existing
 ? "<strong>Existing clients:</strong> Continue only when you have previously completed an approved consultation and patch test for this treatment. Your previous record will be checked manually before treatment."
 : "<strong>Consultation & Patch Test Required:</strong> Every laser treatment requires an approved consultation and patch test.";

const packages=CONFIG.packages||[];
const carbon=[
 {key:"single_session",name:"Single Carbon Facial",full:85,sessions:1},
 {key:"three_sessions",name:"Course of 3 Carbon Facials",full:225,sessions:3}
];
const fungal=[
 {key:"single_nail",name:"Single Nail",full:45,sessions:1},
 {key:"one_foot",name:"One Foot (Up to 5 Nails)",full:85,sessions:1},
 {key:"both_feet",name:"Both Feet",full:120,sessions:1},
 {key:"course4_one_foot",name:"Course of 4 Sessions (One Foot)",full:300,sessions:4},
 {key:"course4_both_feet",name:"Course of 4 Sessions (Both Feet)",full:420,sessions:4}
];
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function row(item,category,extra={}){
 const clickable=existing||category==="tattoo";
 const price=existing?item.full:(item.deducted??item.full);
 const label=existing?`£${price}`:`£${price}`;
 return `<div class="row"><div><h3>${esc(item.name)}</h3><p>${existing?"Full treatment price":"Approved price after consultation deposit"}</p></div>${clickable?`<button class="pay" onclick='checkout(${JSON.stringify(JSON.stringify({category,package_type:item.key,treatment_name:item.name,amount:price,sessions:item.sessions,...extra}))},this)'>${label}</button>`:`<strong>${label} balance</strong>`}</div>`;
}
let tattooRows="";
for(const p of packages){
 const bundle={key:"six_sessions",name:`${p.name} - 6 Session Bundle`,full:Number(p.fullAmount)/100,deducted:Number(p.bundleAmount)/100,sessions:6};
 const single={key:"single_session",name:`${p.name} - Single Session`,full:Number(p.singleAmount)/100,deducted:Number(p.singleAmount)/100,sessions:1};
 tattooRows+=row(bundle,"tattoo",{tattoo_size:p.key,price_type:existing?"full":"deducted"})+row(single,"tattoo",{tattoo_size:p.key,price_type:"full"});
}
sections.innerHTML=`<section class="section"><h2>Laser Tattoo Removal</h2><p class="section-intro">${existing?"Full prices for returning clients.":"Prices available after an approved consultation and patch test."}</p><div class="rows">${tattooRows}</div></section>
<section class="section"><h2>Carbon Laser Facial</h2><p class="section-intro">${existing?"Full prices for returning clients.":"Displayed balances are paid using your clinic-issued appointment QR."}</p><div class="rows">${carbon.map(x=>row(x,"carbon")).join("")}</div></section>
<section class="section"><h2>Fungal Nail Laser Treatment</h2><p class="section-intro">${existing?"Full prices for returning clients.":"Displayed balances are paid using your clinic-issued appointment QR."}</p><div class="rows">${fungal.map(x=>row(x,"fungal")).join("")}</div></section>`;
async function checkout(json,button){
 const item=JSON.parse(json); button.disabled=true; status.textContent="Opening secure checkout…";status.className="status";
 try{
  const r=await fetch("/api?payment=create-returning-treatment-checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...item,returning_client:existing})});
  if(!r.ok) throw new Error(await r.text());
  const d=await r.json(); location.href=d.checkout_url;
 }catch(e){status.textContent=e.message||"Checkout could not be opened.";status.className="status error";button.disabled=false;}
}
</script></body></html>
