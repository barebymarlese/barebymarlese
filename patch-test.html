<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Patch Test Form | BARE by Marlese</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

    <style>
        :root {
            --bg: #cacdc6;
            --heading-muted: #878274;
            --heading-dark: #24221a;
            --brand: #5e6959;
            --shadow: 0 18px 45px rgba(0,0,0,.16);
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important; 
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: var(--bg);
        }

        body {
            padding: 10px;
            font-family: "Montserrat", sans-serif;
            color: var(--heading-dark);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .con-card {
            background: rgba(202,205,198,.55);
            border: 1px solid rgba(36,34,26,.16);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 15px 25px;
            max-width: 750px;
            width: 100%;
            margin: auto;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 10px;
            letter-spacing: .26em;
            font-weight: 600;
            text-transform: uppercase;
            justify-content: center;
            margin-bottom: 5px;
        }
        .logo .bare { color: var(--brand); font-size: 20px; }
        .logo .by { letter-spacing: .05em; font-weight: 500; text-transform: none; color: var(--heading-muted); font-size: 13px; }

        .section-title {
            text-align: center;
            margin: 0 0 10px;
            font-size: 18px;
            color: var(--heading-dark);
            letter-spacing: .02em;
            font-weight: 700;
            text-transform: uppercase;
        }

        .con-section {
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(36,34,26,0.14);
            background: rgba(255, 255, 255, 0.2);
        }

        .con-label {
            display: block;
            margin: 6px 0 2px;
            font-weight: 700;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--brand);
        }

        .con-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px; 
            border-radius: 8px;
            border: 1px solid rgba(36,34,26,.22);
            background: rgba(255, 255, 255, 0.5);
            color: var(--heading-dark);
            font-family: inherit;
            outline: none;
            height: 38px;
            text-align: left;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 15px;
            margin-top: 2px;
        }

        .signature-wrapper {
            margin-top: 8px;
            border: 1px solid rgba(36,34,26,.22);
            border-radius: 12px;
            background: white;
            height: 120px; /* Condensed for desktop view */
            position: relative;
            touch-action: none;
        }
        
        canvas { 
            position: absolute;
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
        }

        .con-actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .con-btn {
            flex: 1;
            background: var(--brand);
            font-size: 12px;
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .con-btn-ghost {
            background: transparent;
            border: 1px solid rgba(36,34,26,.25);
            color: var(--heading-dark);
        }

        .disclaimer {
            font-size: 10px;
            line-height: 1.4;
            margin: 10px 0;
            padding: 8px 12px;
            border-left: 3px solid var(--brand);
            background: rgba(255, 255, 255, 0.15);
        }

        @media screen and (max-width: 480px) {
            body { display: block; padding: 20px 10px; }
            .con-card { padding: 20px; }
            .settings-grid { grid-template-columns: 1fr; }
            .signature-wrapper { height: 180px; }
            .con-input { height: 48px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="con-card">
        <div class="logo">
            <span class="bare">BARE |</span>
            <span class="by">by Marlese</span>
        </div>
        
        <h2 class="section-title">Patch Test Record</h2>

        <div class="con-section">
            <div class="settings-grid">
                <div>
                    <label class="con-label">Practitioner Name</label>
                    <input type="text" id="practitioner" class="con-input" value="Marlese Rosch Haden">
                </div>
                <div>
                    <label class="con-label">Date of Test</label>
                    <input type="date" id="testDate" class="con-input">
                </div>
            </div>

            <label class="con-label">Client Name</label>
            <input type="text" id="clientName" class="con-input" placeholder="Full Name">

            <div class="settings-grid">
                <div>
                    <label class="con-label">Test Area</label>
                    <input type="text" id="testArea" class="con-input" placeholder="e.g. Left Inner Arm">
                </div>
                <div>
                    <label class="con-label">Fitzpatrick Type</label>
                    <select id="skinType" class="con-input">
                        <option value="">Select</option>
                        <option value="1">Type I</option>
                        <option value="2">Type II</option>
                        <option value="3">Type III</option>
                        <option value="4">Type IV</option>
                        <option value="5">Type V</option>
                        <option value="6">Type VI</option>
                    </select>
                </div>
            </div>

            <div class="settings-grid">
                <div>
                    <label class="con-label">Machine Serial No.</label>
                    <input type="text" id="serialNo" class="con-input" placeholder="e.g. SN-12345">
                </div>
                <div>
                    <label class="con-label">Wavelength</label>
                    <input type="text" id="wavelength" class="con-input" placeholder="1064/532nm">
                </div>
            </div>

            <div class="settings-grid">
                <div>
                    <label class="con-label">Joules (J/cm²) / Pulse Width (ms)</label>
                    <input type="text" id="joulesPulse" class="con-input" placeholder="e.g. 1.2J / 20ms">
                </div>
                <div>
                    <label class="con-label">Spot Size (mm) / Reaction</label>
                    <input type="text" id="spotReaction" class="con-input" placeholder="e.g. 10mm / Normal">
                </div>
            </div>

            <div class="disclaimer">
                I acknowledge that a patch test has been performed. I will monitor the area for 24-48 hours and report any adverse reactions before proceeding with full treatment.
            </div>

            <label class="con-label">Client Signature</label>
            <div class="signature-wrapper">
                <canvas id="signature-pad"></canvas>
            </div>
        </div>

        <div class="con-actions no-print">
            <button class="con-btn con-btn-ghost" onclick="clearSig()">Clear</button>
            <button class="con-btn" onclick="window.print()">Create PDF</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('signature-pad');
        const signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgb(255, 255, 255)'
        });

        function resizeCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            signaturePad.clear();
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        function clearSig() { signaturePad.clear(); }
        document.getElementById('testDate').valueAsDate = new Date();
    </script>
</body>
</html>
