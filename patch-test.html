<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Patch Test Form | BARE by Marlese</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

<style>
:root {
    --bg: #cacdc6;
    --card-bg: #d4d7d1;
    --heading-muted: #878274;
    --heading-dark: #24221a;
    --brand: #5e6959;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Montserrat", sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
}

.con-card {
    background: rgba(212,215,209,0.9);
    border-radius: 24px;
    padding: 30px 50px;
    max-width: 850px;
    width: 95%;
    margin: 20px auto;
}

.logo {
    text-align: center;
    letter-spacing: .2em;
}

.section-title {
    text-align: center;
    margin-bottom: 20px;
}

.con-section {
    padding: 25px;
}

.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 30px;
}

.con-input {
    height: 40px;
    width: 100%;
}

.reaction-container {
    margin-bottom: 20px;
}

.signature-wrapper {
    margin-top: 10px;
    height: 120px;
    border: 1px solid #ccc;
}

.website-link {
    text-align: center;
    margin-top: 15px;
}

@media print {
    @page { size: A4 portrait; margin: 0; }

    body {
        background: #cacdc6 !important;
    }

    .con-card {
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 10px 18px !important;
    }

    .con-section {
        padding: 20px !important;
    }

    .con-input {
        height: 34px !important;
        font-size: 12px !important;
    }

    .reaction-container {
        margin-bottom: 16px !important;
    }

    .disclaimer {
        font-size: 10px !important;
        margin: 12px 0 !important;
    }

    /* 🔥 PRINT-ONLY SPACE ABOVE SAFETY */
    div[style*="margin-bottom: 20px;"] {
        margin-top: 20px !important;
        margin-bottom: 24px !important;
    }

    /* 🔥 PRINT-ONLY SPACE ABOVE SIGNATURE */
    .signature-wrapper {
        margin-top: 18px !important;
        height: 90px !important;
    }

    .website-link {
        margin-top: auto !important;
        font-size: 9px !important;
    }

    .no-print {
        display: none !important;
    }
}
</style>
</head>

<body>

<div class="con-card">

<div class="logo">BARE by Marlese</div>
<h2 class="section-title">Patch Test Record</h2>

<div class="con-section">

<div class="settings-grid">
<input class="con-input" placeholder="Practitioner">
<input class="con-input" type="date">
</div>

<div class="settings-grid">
<input class="con-input" placeholder="Client Name">
<input class="con-input" placeholder="Test Area">
</div>

<div class="reaction-container">
<div>Reaction options...</div>
</div>

<!-- ✅ SAFETY COMPLIANCE (CLEAN) -->
<div style="margin-bottom: 20px;">
<label>Safety Compliance</label>
<div>
<input type="checkbox" checked> Eye Protection Worn
</div>
</div>

<div class="disclaimer">
Declaration & Consent...
</div>

<label>Client Signature</label>
<div class="signature-wrapper"></div>

</div>

<a class="website-link">https://barebymarlese.com</a>

<div class="no-print">
<button onclick="window.print()">Print</button>
</div>

</div>

</body>
</html>
