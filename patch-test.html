<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bare by Marlese | Patch Test</title>
    <meta name="robots" content="noindex">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        /* EDIT COLORS HERE */
        :root { 
            --brand-primary: #a38f85; /* Soft Earth Tone */
            --brand-dark: #333333;    /* Charcoal Text */
            --brand-bg: #faf9f6;      /* Off-White/Cream Background */
            --accent: #d4cdc3;        /* Light Sand */
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background: var(--brand-bg); 
            color: var(--brand-dark); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }

        .app-container { 
            background: white; 
            max-width: 500px; 
            width: 100%; 
            padding: 40px 30px; 
            border-radius: 5px; /* Minimalist clean edges */
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
        }

        .logo-text {
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: var(--brand-dark);
        }

        h2 { 
            margin-top: 0; 
            color: var(--brand-primary); 
            font-weight: 300;
            font-size: 0.9rem; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        label { 
            display: block; 
            margin-top: 20px; 
            font-weight: 600; 
            font-size: 0.75rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
        }

        input { 
            width: 100%; 
            padding: 12px 0; 
            margin-top: 5px; 
            border: none;
            border-bottom: 1px solid var(--accent);
            border-radius: 0;
            box-sizing: border-box; 
            font-size: 1rem; 
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-bottom: 1px solid var(--brand-primary); }

        .signature-box { 
            border: 1px solid var(--accent); 
            background: #fff; 
            margin-top: 10px; 
            height: 180px; 
            touch-action: none; 
        }

        canvas { width: 100%; height: 100%; }

        .button-group { display: flex; gap: 15px; margin-top: 30px; }

        button { 
            flex: 1; 
            padding: 15px; 
            border: 1px solid var(--brand-primary); 
            border-radius: 0; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .btn-print { background: var(--brand-primary); color: white; }
        .btn-clear { background: transparent; color: var(--brand-primary); }

        .disclaimer { 
            font-size: 0.75rem; 
            color: #888; 
            margin-top: 25px; 
            line-height: 1.6; 
            font-style: italic;
        }

        @media print { .no-print { display: none; } body { padding: 0; background: white; } .app-container { box-shadow: none; border: none; max-width: 100%; } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="logo-text">BARE BY MARLESE</div>
    <h2>Laser Tattoo Removal Patch Test</h2>
    
    <label>Client Name</label>
    <input type="text" id="clientName">

    <label>Date</label>
    <input type="date" id="testDate">

    <label>Test Location & Energy Settings</label>
    <input type="text" id="settings" placeholder="e.g. Inner Ankle / 3.0 J">

    <div class="disclaimer">
        I hereby consent to a laser patch test. I understand that this is a trial to evaluate skin reaction. I will report any adverse effects within 48 hours.
    </div>

    <label>Client Signature</label>
    <div class="signature-box">
        <canvas id="signature-pad"></canvas>
    </div>

    <div class="button-group no-print">
        <button class="btn-clear" onclick="clearSig()">Clear</button>
        <button class="btn-print" onclick="window.print()">Save Record</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('signature-pad');
    const signaturePad = new SignaturePad(canvas);

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        signaturePad.clear();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function clearSig() { signaturePad.clear(); }
    document.getElementById('testDate').valueAsDate = new Date();
</script>

</body>
</html>
