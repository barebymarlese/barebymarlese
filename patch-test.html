<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patch Test Form | BARE by Marlese</title>
    <meta name="robots" content="noindex">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

    <style>
        :root {
            --bg: #cacdc6;
            --heading-muted: #878274;
            --heading-dark: #24221a;
            --brand: #5e6959;
            --shadow: 0 18px 45px rgba(0,0,0,.16);
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: "Montserrat", sans-serif;
            background: var(--bg);
            color: var(--heading-dark);
            display: flex;
            justify-content: center;
        }

        .con-card {
            background: rgba(202,205,198,.55);
            border: 1px solid rgba(36,34,26,.16);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 10px;
            letter-spacing: .26em;
            font-weight: 600;
            text-transform: uppercase;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo .bare { color: var(--brand); font-size: 22px; }
        .logo .by { letter-spacing: .05em; font-weight: 500; text-transform: none; color: var(--heading-muted); font-size: 14px; }

        .section-title {
            text-align: center;
            margin: 10px 0 30px;
            font-size: 28px;
            color: var(--heading-muted);
            letter-spacing: .02em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .con-section {
            margin-top: 14px;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(36,34,26,0.14);
            background: rgba(202,205,198,0.40);
        }

        .con-label {
            display: block;
            margin: 15px 0 6px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .con-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid rgba(36,34,26,.22);
            background: rgba(202,205,198,.65);
            color: var(--heading-dark);
            font-family: inherit;
            outline: none;
        }

        .signature-wrapper {
            margin-top: 10px;
            border: 1px solid rgba(36,34,26,.22);
            border-radius: 12px;
            background: white;
            height: 200px;
            overflow: hidden;
            touch-action: none;
        }
        canvas { width: 100%; height: 100%; cursor: crosshair; }

        .con-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .con-btn {
            flex: 1;
            background: var(--brand);
            font-size: 14px;
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: 14px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .con-btn-ghost {
            background: transparent;
            border: 1px solid rgba(36,34,26,.25);
            color: var(--heading-dark);
        }

        .disclaimer {
            font-size: 12px;
            line-height: 1.6;
            margin-top: 20px;
            opacity: 0.8;
            font-style: italic;
        }

        /* PDF PRINT OPTIMIZATION */
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            .con-card { 
                box-shadow: none; 
                border: none; 
                width: 100%; 
                max-width: 100%; 
                background: white;
            }
            .con-section {
                background: white;
                border: 1px solid #eee;
            }
            .con-input {
                background: white;
                border: none;
                border-bottom: 1px solid #ccc;
                border-radius: 0;
                padding-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="con-card">
        <div class="logo">
            <span class="bare">BARE |</span>
            <span class="by">by Marlese</span>
        </div>
        
        <h2 class="section-title">Patch Test Record</h2>

        <div class="con-section">
            <label class="con-label">Client Name</label>
            <input type="text" id="clientName" class="con-input" placeholder="Enter name">

            <label class="con-label">Date of Test</label>
            <input type="date" id="testDate" class="con-input">

            <label class="con-label">Test Area & Laser Settings</label>
            <input type="text" id="settings" class="con-input" placeholder="e.g. Left Ankle / 3.5J">

            <div class="disclaimer">
                I acknowledge that a patch test has been performed. I will monitor the area for 24-48 hours and report any adverse reactions before proceeding with full treatment.
            </div>

            <label class="con-label">Client Signature</label>
            <div class="signature-wrapper">
                <canvas id="signature-pad"></canvas>
            </div>
        </div>

        <div class="con-actions no-print">
            <button class="con-btn con-btn-ghost" onclick="clearSig()">Clear Signature</button>
            <button class="con-btn" onclick="window.print()">Create PDF Record</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('signature-pad');
        const signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgb(255, 255, 255)'
        });

        function resizeCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            signaturePad.clear();
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        function clearSig() { signaturePad.clear(); }
        document.getElementById('testDate').valueAsDate = new Date();
    </script>
</body>
</html>
