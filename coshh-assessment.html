<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>COSHH Assessment | BARE by Marlese</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#cacdc6;
  --card:#d4d7d1;
  --brand:#5e6959;
  --text:#24221a;
  --muted:#878274;
  --line:rgba(36,34,26,0.10);
}

body{
  margin:0;
  font-family:"Montserrat",sans-serif;
  background:var(--bg);
  color:var(--text);
}

.card{
  max-width:980px;
  margin:0 auto;
  padding:28px;
  background:var(--card);
}

/* 🔥 BRAND HEADER */
.logo{
  display:flex;
  justify-content:center;
  gap:10px;
  letter-spacing:.25em;
  text-transform:uppercase;
  margin-bottom:6px;
}
.logo .bare{color:var(--brand);font-size:22px;font-weight:600;}
.logo .by{color:var(--muted);font-size:14px;text-transform:none;}

h1{
  text-align:center;
  font-size:16px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.section{
  margin-top:14px;
  padding:14px;
  background:rgba(255,255,255,0.3);
  border-radius:12px;
}

.section-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--brand);
  font-weight:700;
  margin-bottom:8px;
}

input, textarea{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid var(--line);
  font-family:inherit;
}

textarea{
  min-height:60px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.wide{
  grid-column:1 / -1;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  border:1px solid var(--line);
  padding:6px;
}

th{
  background:#eee;
  font-size:10px;
}

td textarea{
  border:none;
  background:transparent;
  font-size:11px;
}

/* 🔥 BUTTON */
.actions{
  margin-top:16px;
}
.btn{
  width:100%;
  padding:14px;
  border:none;
  background:var(--brand);
  color:#fff;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  border-radius:10px;
  cursor:pointer;
}

@media print{
  body{
    background:white !important;
  }
  .card{
    background:white !important;
  }
  .actions{
    display:none;
  }
}
</style>
</head>

<body>
<div class="card">

<!-- 🔥 LOGO -->
<div class="logo">
  <span class="bare">BARE |</span>
  <span class="by">by Marlese</span>
</div>

<h1>COSHH Assessment</h1>

<div class="section">
  <div class="section-title">Assessment Details</div>
  <div class="grid">
    <div>
      <label>Business Name</label>
      <input type="text" value="BARE by Marlese">
    </div>
    <div>
      <label>Assessor</label>
      <input type="text" value="Marlese Rosch Haden">
    </div>
    <div>
      <label>Assessment Date</label>
      <input type="date" id="coshhDate">
    </div>
    <div>
      <label>Review Date</label>
      <input type="date">
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Substance Details</div>
  <table>
    <thead>
      <tr>
        <th>Product / Substance</th>
        <th>Hazard</th>
        <th>Control Measures</th>
        <th>PPE Required</th>
        <th>Storage</th>
        <th>First Aid / Emergency</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><textarea>Disinfectant (Clinic Grade)</textarea></td>
        <td><textarea>Skin/eye irritation</textarea></td>
        <td><textarea>Use as directed, ventilated area</textarea></td>
        <td><textarea>Gloves</textarea></td>
        <td><textarea>Closed container</textarea></td>
        <td><textarea>Rinse with water</textarea></td>
      </tr>
    </tbody>
  </table>
</div>

<div class="section">
  <div class="section-title">Sign Off</div>
  <div class="grid">
    <div>
      <label>Signature</label>
      <input type="text">
    </div>
    <div>
      <label>Date Signed</label>
      <input type="datetime-local" id="coshhSign">
    </div>
  </div>
</div>

<!-- 🔥 DOWNLOAD BUTTON -->
<div class="actions">
  <button class="btn" onclick="downloadPDF()">Download PDF</button>
</div>

</div>

<script>
function downloadPDF(){
  const originalTitle = document.title;
  document.title = "BARE-COSHH";
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.title = originalTitle;
    }, 1200);
  }, 150);
}

document.getElementById('coshhDate').valueAsDate = new Date();

function updateTime(){
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('coshhSign').value = now.toISOString().slice(0,16);
}

updateTime();
window.addEventListener('beforeprint', updateTime);
</script>

</body>
</html>
