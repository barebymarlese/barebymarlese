<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="page-title">Reschedule Appointment | BARE by Marlese</title>

<meta property="og:title" content="Reschedule Appointment | BARE by Marlese">
<meta property="og:description" content="Manage your appointment with BARE by Marlese.">
<meta property="og:image" content="https://barebymarlese.com/favicon.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://barebymarlese.com/reschedule.html">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#cacdc6;
  --ink:#24221a;
  --olive:#5e6959;
  --olive-dark:#4f5a4b;
  --stone:#878274;
  --card:#f8f8f6;
  --line:rgba(36,34,26,.12);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{
  font-family:'Montserrat', Arial, sans-serif;
  background:
    radial-gradient(circle at top, rgba(255,255,255,.45), transparent 30%),
    linear-gradient(180deg, #d8dbd4 0%, var(--bg) 100%);
  color:var(--ink);
  min-height:100vh;
}

.page{
  min-height:100vh;
  padding:28px 16px;
}

.shell{
  width:100%;
  max-width:900px;
  margin:0 auto;
}

.brand{
  text-align:center;
  margin:0 0 18px;
}

#brand-main{
  color:#5e6959;
  font-size:24px;
  font-weight:600;
  letter-spacing:.26em;
  text-transform:uppercase;
}

.brand-divider{
  color:#5e6959;
  opacity:.8;
  margin:0 12px;
  font-size:22px;
}

#brand-sub{
  color:#878274;
  font-size:15px;
  font-weight:500;
  letter-spacing:.05em;
  text-transform:none;
}

.card{
  background:rgba(248,248,246,.9);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:0 18px 60px rgba(36,34,26,.10);
  overflow:hidden;
  backdrop-filter:blur(6px);
}

.hero{
  padding:40px 28px 24px;
  text-align:center;
  background:linear-gradient(180deg, rgba(94,105,89,.08), rgba(94,105,89,0) 100%);
  border-bottom:1px solid var(--line);
}

.kicker{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(94,105,89,.10);
  color:var(--olive);
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
}

h1{
  margin:18px 0 10px;
  font-size:clamp(28px,4vw,42px);
  line-height:1.1;
  font-weight:600;
}

.sub{
  max-width:680px;
  margin:0 auto;
  font-size:15px;
  line-height:1.7;
  color:rgba(36,34,26,.78);
}

.content{
  padding:26px;
}

.summary{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin:0 auto 26px;
  max-width:560px;
  text-align:left;
  box-shadow:0 8px 24px rgba(36,34,26,.04);
}

.summary p{
  margin:8px 0;
  font-size:14px;
  line-height:1.55;
}

.summary strong{
  color:var(--olive);
}

.form-panel{
  background:#f4f5f3;
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  text-align:center;
}

label{
  display:block;
  margin:0 0 10px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.10em;
  text-transform:uppercase;
  color:var(--olive);
}

input{
  width:100%;
  max-width:360px;
  padding:14px 16px;
  border:1px solid rgba(36,34,26,.15);
  border-radius:12px;
  font-family:inherit;
  font-size:15px;
  color:var(--ink);
  background:white;
}

#available-slots{
  margin-top:24px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.slot-message{
  width:100%;
  font-size:14px;
  color:rgba(36,34,26,.68);
  line-height:1.6;
}

.btn{
  appearance:none;
  border:0;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:14px 18px;
  border-radius:14px;
  text-decoration:none;
  font-family:inherit;
  font-weight:600;
  font-size:14px;
  transition:transform .18s ease, opacity .18s ease, background .18s ease;
}

.btn:hover{
  transform:translateY(-1px);
  opacity:.95;
}

.btn-primary{
  background:var(--olive);
  color:#fff;
}

.slot-btn{
  margin:5px;
  min-width:118px;
  background:var(--olive);
  color:white;
}

.next-slot{
  box-shadow:0 0 0 3px rgba(94,105,89,.18);
  background:var(--olive-dark);
}

#status{
  margin-top:20px;
  font-size:14px;
  line-height:1.6;
}

.success{
  color:#4f5a4b;
  font-weight:600;
}

.error{
  color:#8a3b3b;
  font-weight:600;
}

.success-card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-top:20px;
  box-shadow:0 8px 24px rgba(36,34,26,.04);
}

footer{
  text-align:center;
  padding:18px 10px 0;
  color:rgba(36,34,26,.6);
  font-size:12px;
}

@media(max-width:820px){
  .page{padding:22px 12px}
  .hero{padding:34px 20px 22px}
  .content{padding:18px}
  .form-panel{padding:18px}
  input{max-width:100%}
  .btn{width:100%}
  .slot-btn{width:auto;min-width:130px}
  .logo-wrap img{max-width:140px}
}
</style>
</head>

<body>

<div class="page">
  <div class="shell">

<div class="brand">
  <span id="brand-main"></span>
  <span class="brand-divider">|</span>
  <span class="brand-sub" id="brand-sub"></span>
</div>

    <div class="card">
      <div class="hero">
        <span class="kicker">Appointment Update</span>
        <h1>Reschedule Appointment</h1>
        <p class="sub">Choose a new appointment date and time below. Your previous appointment will be updated once you confirm.</p>
      </div>

      <div class="content">
        <div id="booking-summary" class="summary">
          <p>Loading appointment details...</p>
        </div>

        <div class="form-panel">
          <label for="booking-date">Choose a new date</label>
          <input type="date" id="booking-date">

          <div id="available-slots">
            <div class="slot-message">Please choose a date to view available times.</div>
          </div>

          <p id="status"></p>
        </div>
      </div>
    </div>

    <footer>
  <div style="line-height:1.7;">
    <strong id="legal-name"></strong><br>
    <span id="registered-in"></span><br>
    Company No. <span id="company-number"></span>
  </div>
  <div style="margin-top:10px;">Appointment rescheduling</div>
</footer>
  </div>
</div>

<script src="/config.js"></script>
<script src="/branding.js"></script>
<script>
const CONFIG = window.SITE_CONFIG || {};

const legalName=document.getElementById("legal-name");
const registeredIn=document.getElementById("registered-in");
const companyNumber=document.getElementById("company-number");

if(legalName){legalName.textContent=CONFIG.legalName||"";}
if(registeredIn){registeredIn.textContent=CONFIG.registeredIn||"";}
if(companyNumber){companyNumber.textContent=CONFIG.companyNumber||"";}
const pageTitle = document.getElementById("page-title");

if (pageTitle) {
  pageTitle.textContent = `${CONFIG.pages?.rescheduleTitle || "Reschedule Appointment"} | ${CONFIG.businessName || "BARE by Marlese"}`;
}
const businessName = CONFIG.businessName || "BARE by Marlese";

const params = new URLSearchParams(window.location.search);
const bookingId = params.get("id");
const sessionId = params.get("session_id");
const token = params.get("token");
const isSessionMode = Boolean(sessionId);

let selectedDate = "";
let selectedTime = "";
let bookingType = "consultation";
let activeSessionId = null;
let activeSessionToken = null;
let activeMode = "reschedule";

function escapeHtml(value){
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function setMinDate(){
  const dateInput = document.getElementById("booking-date");
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");
  dateInput.min = `${yyyy}-${mm}-${dd}`;
}

async function loadBooking(){
  const summary = document.getElementById("booking-summary");
  const status = document.getElementById("status");

  if((!bookingId && !sessionId) || !token){
    summary.innerHTML = "<p>Invalid reschedule link.</p>";
    status.textContent = `Please contact ${businessName} if you need help changing your appointment.`;
    status.className = "error";
    return;
  }

  try{
    const res = isSessionMode
  ? await fetch(`/api?session=booking&session_id=${encodeURIComponent(sessionId)}&token=${encodeURIComponent(token)}`)
  : await fetch(`/api?reschedule=booking&id=${encodeURIComponent(bookingId)}&token=${encodeURIComponent(token)}`);

    if(!res.ok){
      summary.innerHTML = "<p>This reschedule link is invalid or has expired.</p>";
      status.textContent = `Please contact ${businessName} if you need help changing your appointment.`;
      status.className = "error";
      return;
    }

    const booking = await res.json();
    bookingType = booking.booking_type || "consultation";

    if (isSessionMode) {
  activeMode = "session-reschedule";
  activeSessionId = booking.id;
  activeSessionToken = token;
  bookingType = "treatment";
}

    const sessionsHtml = Array.isArray(booking.sessions) && booking.sessions.length
      ? `
        <hr style="border:0;border-top:1px solid rgba(36,34,26,.12);margin:16px 0;">
        <p><strong>Your treatment package</strong></p>
        ${booking.sessions.map(session => `
          <div style="padding:10px 0;border-bottom:1px solid rgba(36,34,26,.08);">
            <p><strong>Session ${session.session_number}:</strong> ${escapeHtml(session.status)}</p>
            ${session.appointment_date ? `<p>${escapeHtml(session.appointment_date)} at ${escapeHtml(session.appointment_time)}</p>` : ""}      
          </div>
        `).join("")}
      `
      : "";

    summary.innerHTML = `
      <p><strong>Appointment details</strong></p>
      <p><strong>Name:</strong> ${escapeHtml(booking.client_name || "Client")}</p>
      <p><strong>Date:</strong> ${escapeHtml(booking.appointment_date)}</p>
      <p><strong>Time:</strong> ${escapeHtml(booking.appointment_time)}</p>
      <p><strong>Type:</strong> ${escapeHtml(booking.booking_type || "consultation")}</p>
      ${booking.treatment_name ? `<p><strong>Treatment:</strong> ${escapeHtml(booking.treatment_name)}</p>` : ""}
      <p><strong>Status:</strong> ${escapeHtml(booking.status)}</p>
      ${sessionsHtml}
    `;

    if (
  (isSessionMode && booking.status !== "booked") ||
  (!isSessionMode && booking.status !== "confirmed")
){
  status.textContent = "This appointment can no longer be rescheduled.";
  status.className = "error";
  document.getElementById("booking-date").disabled = true;
}

  }catch(err){
    summary.innerHTML = "<p>Could not load appointment details.</p>";
    status.textContent = `Please try again or contact ${businessName}.`;
    status.className = "error";
  }
}

async function loadAvailableSlots(date){
  const container = document.getElementById("available-slots");
  const status = document.getElementById("status");

  selectedDate = "";
  selectedTime = "";
  status.textContent = "";
  status.className = "";
  container.innerHTML = '<div class="slot-message">Loading available times...</div>';

  try{
    const res = await fetch(`/api?type=${encodeURIComponent(bookingType)}&date=${encodeURIComponent(date)}`);
    const data = await res.json();

    const slots = data.slots || [];
    const nextAvailable = data.nextAvailable || null;

    if(!Array.isArray(slots) || slots.length === 0){
      container.innerHTML = '<div class="slot-message">No availability for this date.</div>';
      return;
    }

    container.innerHTML = slots.map(slot => `
      <button class="btn slot-btn ${slot === nextAvailable ? "next-slot" : ""}" type="button" onclick="selectSlot('${date}', '${slot}', this)">
        ${slot === nextAvailable ? "Next available: " : ""}${slot}
      </button>
    `).join("") + `
      <div style="width:100%; margin-top:18px;">
        <button id="confirm-reschedule-btn" class="btn btn-primary" type="button" style="display:none;" onclick="confirmReschedule()">
          ${activeMode === "session-reschedule" ? "Confirm Treatment Session" : "Confirm New Appointment"}
        </button>
      </div>
    `;

  }catch(err){
    container.innerHTML = '<div class="slot-message">Could not load available times. Please try again.</div>';
  }
}

function selectSlot(date, time, button){
  selectedDate = date;
  selectedTime = time;

  document.querySelectorAll(".slot-btn").forEach(btn => {
    btn.style.opacity = "1";
    btn.style.outline = "none";
  });

  button.style.opacity = "0.75";
  button.style.outline = "3px solid rgba(94,105,89,.25)";

  const confirmBtn = document.getElementById("confirm-reschedule-btn");
  confirmBtn.style.display = "inline-flex";
  confirmBtn.textContent = activeMode === "session-reschedule"
    ? `Confirm treatment session at ${time}`
    : `Confirm ${time}`;
}

async function confirmReschedule(){
  const status = document.getElementById("status");

  if(!selectedDate || !selectedTime){
    return;
  }

  status.textContent = activeMode === "session-reschedule"
    ? "Updating your treatment session..."
    : "Updating your appointment...";
  status.className = "";

  const endpoint = activeMode === "session-reschedule"
  ? "/api?session=reschedule"
  : "/api?reschedule=update";

  const payload = activeMode === "session-reschedule"
    ? {
        session_id: activeSessionId,
        token: activeSessionToken,
        appointment_date: selectedDate,
        appointment_time: selectedTime
      }
    : {
        id: bookingId,
        token: token,
        appointment_date: selectedDate,
        appointment_time: selectedTime
      };

  try{
    const res = await fetch(endpoint, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    if(res.ok){
      status.innerHTML = `
        <div class="success-card">
          <p class="success">${activeMode === "session-reschedule" ? "Your treatment session has been updated." : "Your appointment has been updated."}</p>
          <p><strong>New date:</strong> ${escapeHtml(selectedDate)}</p>
          <p><strong>New time:</strong> ${escapeHtml(selectedTime)}</p>
          <p>Please check your inbox and junk/spam folder for any updated booking information.</p>
          <p style="margin-top:10px; font-size:13px; color:#878274;">
            Redirecting you back to the website...
          </p>
        </div>
      `;

      document.getElementById("available-slots").innerHTML = "";

      setTimeout(() => {
        window.location.href = CONFIG.domain || "/";
      }, 5000);

    }else{
      const text = await res.text();
      status.textContent = text || "Could not reschedule. Please try another time.";
      status.className = "error";
    }

  }catch(err){
    status.textContent = "There was a problem updating your appointment. Please try again.";
    status.className = "error";
  }
}

document.getElementById("booking-date").addEventListener("change", function(e){
  if(e.target.value){
    loadAvailableSlots(e.target.value);
  }
});

setMinDate();
loadBooking();
</script>

</body>
</html>
