<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Treatment Booking | BARE by Marlese</title>
<link id="favicon-link" rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#cacdc6;--ink:#24221a;--olive:#5e6959;--olive-dark:#4f5a4b;--stone:#878274;--card:#f8f8f6;--line:rgba(36,34,26,.12)}*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:'Montserrat',Arial,sans-serif;background:radial-gradient(circle at top,rgba(255,255,255,.45),transparent 30%),linear-gradient(180deg,#d8dbd4 0%,var(--bg) 100%);color:var(--ink);min-height:100vh}.page{min-height:100vh;padding:28px 16px}.shell{width:100%;max-width:900px;margin:0 auto}.brand{text-align:center;margin:0 0 18px}
#brand-main{color:#5e6959;font-size:24px;font-weight:600;letter-spacing:.26em;text-transform:uppercase}
.brand-divider{color:#5e6959;opacity:.8;margin:0 12px;font-size:22px}
#brand-sub{color:#878274;font-size:15px;font-weight:500;letter-spacing:.05em;text-transform:none}.card{background:rgba(248,248,246,.9);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 60px rgba(36,34,26,.10);overflow:hidden;backdrop-filter:blur(6px)}.hero{padding:40px 28px 24px;text-align:center;background:linear-gradient(180deg,rgba(94,105,89,.08),rgba(94,105,89,0) 100%);border-bottom:1px solid var(--line)}.kicker{display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(94,105,89,.10);color:var(--olive);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}h1{margin:18px 0 10px;font-size:clamp(28px,4vw,42px);line-height:1.1;font-weight:600}.sub{max-width:680px;margin:0 auto;font-size:15px;line-height:1.7;color:rgba(36,34,26,.78)}.content{padding:26px}.locked,.form-panel,.success-card{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(36,34,26,.04)}.locked{text-align:center}.summary{background:#f4f5f3;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:22px}.summary p{margin:7px 0;font-size:14px}.summary strong{color:var(--olive)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:8px}label{font-size:12px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--olive)}input,select{width:100%;padding:14px 16px;border:1px solid rgba(36,34,26,.15);border-radius:12px;font-family:inherit;font-size:15px;color:var(--ink);background:white}.declaration{margin:18px 0;padding:14px 16px;border-radius:14px;background:#f4f5f3;border:1px solid var(--line);font-size:13px;line-height:1.6}.declaration label{display:flex;align-items:flex-start;gap:10px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}.declaration input{width:auto;margin-top:3px}#available-slots{margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.slot-message{width:100%;font-size:14px;color:rgba(36,34,26,.68);line-height:1.6;text-align:center}.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:14px 18px;border-radius:14px;text-decoration:none;font-family:inherit;font-weight:700;font-size:14px;transition:transform .18s ease,opacity .18s ease,background .18s ease}.btn:hover{transform:translateY(-1px);opacity:.95}.btn-primary{background:var(--olive);color:#fff}.btn-secondary{background:#eceee9;color:var(--ink)}.slot-btn{margin:5px;min-width:118px;background:var(--olive);color:white}.next-slot{box-shadow:0 0 0 3px rgba(94,105,89,.18);background:var(--olive-dark)}#status{margin-top:20px;font-size:14px;line-height:1.6;text-align:center}.success{color:#4f5a4b;font-weight:700}.error{color:#8a3b3b;font-weight:700}footer{text-align:center;padding:18px 10px 0;color:rgba(36,34,26,.6);font-size:12px}@media(max-width:760px){.page{padding:22px 12px}.hero{padding:34px 20px 22px}.content{padding:18px}.grid{grid-template-columns:1fr}.btn{width:100%}.slot-btn{width:auto;min-width:130px}}
</style>
</head>
<body>
<div class="page"><div class="shell"><div class="brand">
  <span id="brand-main"></span>
  <span class="brand-divider">|</span>
  <span class="brand-sub" id="brand-sub"></span>
</div><div class="card"><div class="hero"><span class="kicker" id="hero-kicker">Treatment Calendar</span><h1 id="hero-title">Book Your Treatment</h1><p class="sub" id="hero-subtext">Choose your treatment appointment.</p></div><div class="content" id="content"></div></div><footer>
  <div style="line-height:1.7;">
    <strong id="legal-name"></strong><br>
    <span id="registered-in"></span><br>
    Company No. <span id="company-number"></span>
  </div>
  <div style="margin-top:10px;" id="footer-booking-label">Treatment booking</div>
</footer></div></div>

<script src="/config.js"></script>
<script src="/analytics.js"></script>
<script src="/branding.js"></script>
<script>
const CONFIG = window.SITE_CONFIG || {};

const legalName=document.getElementById("legal-name");
const registeredIn=document.getElementById("registered-in");
const companyNumber=document.getElementById("company-number");

if(legalName){legalName.textContent=CONFIG.legalName||"";}
if(registeredIn){registeredIn.textContent=CONFIG.registeredIn||"";}
if(companyNumber){companyNumber.textContent=CONFIG.companyNumber||"";}

const pageTitle = document.getElementById("page-title");
if (pageTitle) {
  pageTitle.textContent = `${CONFIG.pages?.treatmentBookingTitle || "Treatment Booking"} | ${CONFIG.businessName || "BARE by Marlese"}`;
}

const packages = Array.isArray(CONFIG.packages) ? CONFIG.packages : [];
const laserPackages = Array.isArray(CONFIG.laserTreatmentPackages)
  ? CONFIG.laserTreatmentPackages
  : [];

const params = new URLSearchParams(window.location.search);
const clientMode = (params.get("client") || "").toLowerCase();
const isReturningClient = clientMode === "existing";

const paid = params.get("paid");
const sessionId = params.get("session_id");
const categoryFromUrl = (params.get("category") || "").toLowerCase();
const packageFromUrl = (params.get("package") || params.get("package_type") || "").toLowerCase();
const sizeFromUrl = (params.get("size") || "").toLowerCase();
const typeFromUrl = (params.get("type") || "").toLowerCase();
const priceTypeFromUrl = (params.get("price") || "deducted").toLowerCase();
const sessionsFromUrl = Number(params.get("sessions") || 0);

const content = document.getElementById("content");
const heroKicker = document.getElementById("hero-kicker");
const heroTitle = document.getElementById("hero-title");
const heroSubtext = document.getElementById("hero-subtext");
const footerBookingLabel = document.getElementById("footer-booking-label");

let selectedDate = "";
let selectedTime = "";

function escapeHtml(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

function setMinDate(){
  const dateInput = document.getElementById("booking-date");
  if(!dateInput) return;

  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");
  dateInput.min = `${yyyy}-${mm}-${dd}`;
}

function treatmentCategoryLabel(category){
  if(category === "carbon") return "Carbon Laser Facial";
  if(category === "fungal") return "Fungal Nail Laser Treatment";
  return "Laser Tattoo Removal";
}

function packageTypeForReturning(category, key){
  if(category === "tattoo"){
    return typeFromUrl === "single" ? "single_session" : "six_sessions";
  }

  if(category === "carbon"){
    return key === "carbon_course3" ? "three_sessions" : "single_session";
  }

  return key;
}

function sessionsForReturning(category, key){
  if(category === "tattoo") return typeFromUrl === "single" ? 1 : 6;
  if(category === "carbon") return key === "carbon_course3" ? 3 : 1;
  if(key === "fungal_course4_one_foot" || key === "fungal_course4_both_feet") return 4;
  return 1;
}

function getReturningSelection(){
  if(categoryFromUrl === "tattoo"){
    const pkg = packages.find(item =>
      String(item.key || "").toLowerCase() === sizeFromUrl
    );

    if(!pkg) return null;

    const isSingle = typeFromUrl === "single";
    const isBundle = typeFromUrl === "bundle";
    if(!isSingle && !isBundle) return null;

    return {
      category: "tattoo",
      packageKey: sizeFromUrl,
      packageType: isSingle ? "single_session" : "six_sessions",
      sessions: isSingle ? 1 : 6,
      tattooSize: sizeFromUrl,
      name: isSingle
        ? `${pkg.name} - Single Session`
        : `${pkg.name} - 6 Session Bundle`,
      price: isSingle ? pkg.singlePrice : pkg.fullPrice,
      amount: isSingle ? pkg.singleAmount : pkg.fullAmount
    };
  }

  if(categoryFromUrl === "carbon" || categoryFromUrl === "fungal"){
    const item = laserPackages.find(pkg =>
      String(pkg.key || "").toLowerCase() === packageFromUrl
    );

    if(!item) return null;

    const itemCategory = String(item.key || "").startsWith("carbon_")
      ? "carbon"
      : "fungal";

    if(itemCategory !== categoryFromUrl) return null;

    return {
      category: itemCategory,
      packageKey: item.key,
      packageType: packageTypeForReturning(itemCategory, item.key),
      sessions: sessionsForReturning(itemCategory, item.key),
      tattooSize: null,
      name: item.name,
      price: item.price,
      amount: item.amount
    };
  }

  return null;
}

const returningSelection = isReturningClient
  ? getReturningSelection()
  : null;

/* Existing paid Tattoo route */
const pricing = {
  bundle: {
    deducted: Object.fromEntries(packages.map(pkg => [
      pkg.key,
      {
        label: `${pkg.name} - 6 Session Bundle`,
        price: pkg.bundlePrice,
        amount: pkg.bundleAmount
      }
    ])),
    full: Object.fromEntries(packages.map(pkg => [
      pkg.key,
      {
        label: `${pkg.name} - 6 Session Bundle`,
        price: pkg.fullPrice,
        amount: pkg.fullAmount
      }
    ]))
  },
  single: Object.fromEntries(packages.map(pkg => [
    pkg.key,
    {
      label: `${pkg.name} - Single Session`,
      price: pkg.singlePrice,
      amount: pkg.singleAmount
    }
  ]))
};

const validSizes = new Set(packages.map(pkg => String(pkg.key || "").toLowerCase()));
const validType = typeFromUrl === "single" || typeFromUrl === "bundle";
const validPriceType = priceTypeFromUrl === "full" || priceTypeFromUrl === "deducted";
const validSessionCount =
  typeFromUrl === "single"
    ? sessionsFromUrl === 0 || sessionsFromUrl === 1
    : sessionsFromUrl === 6;

const validStripeReturn =
  !isReturningClient &&
  paid === "true" &&
  Boolean(sessionId && sessionId.startsWith("cs_")) &&
  validSizes.has(sizeFromUrl) &&
  validType &&
  validPriceType &&
  validSessionCount;

if(validStripeReturn){
  localStorage.setItem("bare_payment_reference", sessionId);
  localStorage.setItem("bareTreatmentPaid", "true");
  localStorage.setItem("bareTreatmentPackage", sizeFromUrl);
  localStorage.setItem("bareTreatmentType", typeFromUrl);
  localStorage.setItem("bareTreatmentPriceType", priceTypeFromUrl);
  localStorage.setItem(
    "bareTreatmentSessions",
    String(typeFromUrl === "single" ? 1 : 6)
  );
}else if(!isReturningClient && paid === "true"){
  localStorage.removeItem("bareTreatmentPaid");
  localStorage.removeItem("bareTreatmentPackage");
  localStorage.removeItem("bareTreatmentType");
  localStorage.removeItem("bareTreatmentPriceType");
  localStorage.removeItem("bareTreatmentSessions");
  localStorage.removeItem("bare_payment_reference");
}

const hasPaid = localStorage.getItem("bareTreatmentPaid") === "true";
const storedPackageKey = (localStorage.getItem("bareTreatmentPackage") || "").toLowerCase();
const storedType = localStorage.getItem("bareTreatmentType") || "";
const storedPriceType = localStorage.getItem("bareTreatmentPriceType") || "deducted";

let paidSelection;

if(storedType === "single"){
  paidSelection = pricing.single[storedPackageKey];
}else if(storedType === "bundle"){
  paidSelection = pricing.bundle[storedPriceType]?.[storedPackageKey];
}

function renderLocked(message){
  content.innerHTML = `
    <div class="locked">
      <h2>Treatment booking is locked</h2>
      <p>${escapeHtml(message || "Please choose your treatment before continuing.")}</p>
      <a class="btn btn-primary" href="/treatment.html${isReturningClient ? "?client=existing" : ""}">
        Return to Treatments
      </a>
    </div>
  `;
}

function renderReturningBooking(){
  if(!returningSelection){
    renderLocked("The returning-client treatment selection is missing or invalid.");
    return;
  }

  if(heroKicker) heroKicker.textContent = "Returning Client";
  if(heroTitle) heroTitle.textContent = `Book ${treatmentCategoryLabel(returningSelection.category)}`;
  if(heroSubtext) heroSubtext.textContent =
    "Choose your appointment first. Your slot will then be linked to Stripe Checkout for payment.";
  if(footerBookingLabel) footerBookingLabel.textContent = "Returning client treatment booking";

  content.innerHTML = `
    <div class="summary">
      <p><strong>Client type:</strong> Existing client</p>
      <p><strong>Treatment:</strong> ${escapeHtml(returningSelection.name)}</p>
      <p><strong>Full price:</strong> ${escapeHtml(returningSelection.price)}</p>
      <p><strong>Sessions:</strong> ${escapeHtml(returningSelection.sessions)}</p>
    </div>

    <div class="form-panel">
      <div class="grid">
        <div class="field">
          <label for="client-name">Full name</label>
          <input id="client-name" type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="client-email">Email</label>
          <input id="client-email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="client-phone">Phone</label>
          <input id="client-phone" type="tel" autocomplete="tel" required>
        </div>

        <div class="field">
          <label for="booking-date">Choose date</label>
          <input type="date" id="booking-date" required>
        </div>
      </div>

      <div class="declaration">
        <label>
          <input type="checkbox" id="returning-confirmation">
          <span>
            I confirm that I have previously completed an approved consultation and patch test with BARE by Marlese for this treatment. I understand that my previous treatment history will be checked before treatment proceeds.
          </span>
        </label>
      </div>

      <div id="available-slots">
        <div class="slot-message">Please choose a date to view treatment times.</div>
      </div>

      <p id="status"></p>
    </div>
  `;

  setMinDate();

  document.getElementById("booking-date").addEventListener("change", event => {
    if(event.target.value) loadAvailableSlots(event.target.value, true);
  });
}

function renderPaidTattooBooking(){
  if(!paidSelection){
    renderLocked("This page opens only after a verified Tattoo treatment payment.");
    return;
  }

  if(heroKicker) heroKicker.textContent = "Tattoo Treatment Calendar";
  if(heroTitle) heroTitle.textContent = "Book Your Tattoo Treatment";
  if(heroSubtext) heroSubtext.textContent =
    "Choose your first Tattoo removal appointment after completing payment.";
  if(footerBookingLabel) footerBookingLabel.textContent = "Tattoo treatment booking";

  content.innerHTML = `
    <div class="summary">
      <p><strong>Eligibility:</strong> Consultation & Patch Test Required</p>
      <p><strong>Selected package:</strong> ${escapeHtml(paidSelection.label)}</p>
      <p><strong>Paid:</strong> ${escapeHtml(paidSelection.price)}</p>
    </div>

    <div class="form-panel">
      <div class="grid">
        <div class="field">
          <label for="client-name">Full name</label>
          <input id="client-name" type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="client-email">Email</label>
          <input id="client-email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="client-phone">Phone</label>
          <input id="client-phone" type="tel" autocomplete="tel" required>
        </div>

        <div class="field">
          <label for="booking-date">Choose date</label>
          <input type="date" id="booking-date" required>
        </div>
      </div>

      <div id="available-slots">
        <div class="slot-message">Please choose a date to view treatment times.</div>
      </div>

      <p id="status"></p>
    </div>
  `;

  setMinDate();

  document.getElementById("booking-date").addEventListener("change", event => {
    if(event.target.value) loadAvailableSlots(event.target.value, false);
  });
}

async function loadAvailableSlots(date, returning){
  const container = document.getElementById("available-slots");
  const status = document.getElementById("status");

  selectedDate = "";
  selectedTime = "";
  status.textContent = "";
  status.className = "";
  container.innerHTML = '<div class="slot-message">Loading treatment times...</div>';

  try{
    const response = await fetch(
      `/api?type=treatment&date=${encodeURIComponent(date)}`
    );
    const data = await response.json();
    const slots = data.slots || [];
    const nextAvailable = data.nextAvailable || null;

    if(!Array.isArray(slots) || slots.length === 0){
      container.innerHTML =
        '<div class="slot-message">No treatment availability for this date.</div>';
      return;
    }

    const buttonLabel = returning
      ? "Continue to Secure Payment"
      : "Confirm Treatment";

    container.innerHTML =
      slots.map(slot => `
        <button
          class="btn slot-btn ${slot === nextAvailable ? "next-slot" : ""}"
          type="button"
          onclick="selectSlot('${date}','${slot}',this)"
        >
          ${slot === nextAvailable ? "Next available: " : ""}${slot}
        </button>
      `).join("") +
      `
        <div style="width:100%;margin-top:18px;text-align:center;">
          <button
            id="confirm-booking-btn"
            class="btn btn-primary"
            type="button"
            style="display:none;"
            onclick="${returning ? "startReturningCheckout()" : "confirmPaidTattooBooking()"}"
          >
            ${buttonLabel}
          </button>
        </div>
      `;
  }catch(error){
    container.innerHTML =
      '<div class="slot-message">Could not load treatment times. Please try again.</div>';
  }
}

function selectSlot(date,time,button){
  selectedDate = date;
  selectedTime = time;

  document.querySelectorAll(".slot-btn").forEach(btn => {
    btn.style.opacity = "1";
    btn.style.outline = "none";
  });

  button.style.opacity = "0.75";
  button.style.outline = "3px solid rgba(94,105,89,.25)";

  const confirmBtn = document.getElementById("confirm-booking-btn");
  confirmBtn.style.display = "inline-flex";
  confirmBtn.textContent = isReturningClient
    ? `Continue with ${time}`
    : `Confirm ${time}`;
}

function getClientFields(){
  return {
    name: document.getElementById("client-name")?.value.trim() || "",
    email: document.getElementById("client-email")?.value.trim() || "",
    phone: document.getElementById("client-phone")?.value.trim() || ""
  };
}

async function startReturningCheckout(){
  const status = document.getElementById("status");
  const client = getClientFields();
  const confirmation = document.getElementById("returning-confirmation");

  if(!client.name || !client.email || !client.phone){
    status.textContent = "Please enter your name, email and phone number.";
    status.className = "error";
    return;
  }

  if(!selectedDate || !selectedTime){
    status.textContent = "Please choose a treatment time.";
    status.className = "error";
    return;
  }

  if(!confirmation?.checked){
    status.textContent =
      "Please confirm that you are an existing client with a previously approved consultation and patch test.";
    status.className = "error";
    return;
  }

  status.textContent = "Reserving your appointment and opening secure payment...";
  status.className = "";

  const button = document.getElementById("confirm-booking-btn");
  if(button) button.disabled = true;

  try{
    const response = await fetch(
      "/api?payment=create-returning-treatment-checkout",
      {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          client_type: "existing",
          booking_type: "treatment",
          treatment_category: returningSelection.category,
          treatment_name: returningSelection.name,
          package_type: returningSelection.packageType,
          package_key: returningSelection.packageKey,
          tattoo_size: returningSelection.tattooSize,
          sessions_total: returningSelection.sessions,
          full_price: returningSelection.amount / 100,
          client_name: client.name,
          email: client.email,
          phone: client.phone,
          appointment_date: selectedDate,
          appointment_time: selectedTime,
          returning_client_confirmation: true
        })
      }
    );

    if(!response.ok){
      const message = await response.text();
      throw new Error(
        message || "The appointment could not be reserved for payment."
      );
    }

    const data = await response.json();

    if(!data.checkout_url){
      throw new Error("Stripe Checkout URL was not returned.");
    }

    window.location.href = data.checkout_url;
  }catch(error){
    status.textContent =
      error.message || "There was a problem opening secure payment.";
    status.className = "error";
    if(button) button.disabled = false;
  }
}

async function confirmPaidTattooBooking(){
  const status = document.getElementById("status");
  const client = getClientFields();

  if(!client.name || !client.email || !client.phone){
    status.textContent = "Please enter your name, email and phone number.";
    status.className = "error";
    return;
  }

  if(!selectedDate || !selectedTime){
    status.textContent = "Please choose a treatment time.";
    status.className = "error";
    return;
  }

  status.textContent = "Saving your Tattoo treatment booking...";
  status.className = "";

  try{
    const response = await fetch("/api",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        booking_type:"treatment",
        package_type:
          storedType === "single"
            ? "single_session"
            : "six_sessions",
        tattoo_size: storedPackageKey,
        treatment_category: "tattoo",
        treatment_name: paidSelection.label,
        amount_paid: paidSelection.amount / 100,
        client_name: client.name,
        email: client.email,
        phone: client.phone,
        appointment_date: selectedDate,
        appointment_time: selectedTime,
        payment_reference:
          localStorage.getItem("bare_payment_reference") || null
      })
    });

    if(!response.ok){
      const message = await response.text();
      status.textContent =
        message || "Could not book this Tattoo treatment time.";
      status.className = "error";
      return;
    }

    localStorage.removeItem("bareTreatmentPaid");
    localStorage.removeItem("bareTreatmentPackage");
    localStorage.removeItem("bareTreatmentType");
    localStorage.removeItem("bareTreatmentPriceType");
    localStorage.removeItem("bareTreatmentSessions");
    localStorage.removeItem("bare_payment_reference");

    content.innerHTML = `
      <div class="success-card">
        <p class="success">Thank you — your Tattoo treatment appointment has been confirmed.</p>
        <p><strong>Treatment:</strong> ${escapeHtml(paidSelection.label)}</p>
        <p><strong>Date:</strong> ${escapeHtml(selectedDate)}</p>
        <p><strong>Time:</strong> ${escapeHtml(selectedTime)}</p>
        <p>Your booking has been successfully secured.</p>
        <p>Please check your inbox for your confirmation email.</p>
        <p style="margin-top:10px;font-size:13px;color:#878274;">
          Redirecting you back to the website...
        </p>
      </div>
    `;

    setTimeout(() => {
      window.location.href = CONFIG.domain || "/";
    }, 5000);
  }catch(error){
    status.textContent =
      "There was a problem saving your Tattoo treatment booking. Please try again.";
    status.className = "error";
  }
}

if(isReturningClient){
  renderReturningBooking();
}else if(hasPaid && paidSelection){
  renderPaidTattooBooking();
}else{
  renderLocked(
    "This page opens after choosing a returning-client treatment or after a verified Tattoo treatment payment."
  );
}

</script>
</body>
</html>
